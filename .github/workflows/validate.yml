name: validate-and-publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # package.json et package-lock.json ne sont pas versionnés (voir .gitignore) :
      # on installe jsdom sans lockfile pour le test DOM, sans dépendance au dépôt.
      # jsdom@30 dépend de undici, qui exige zlib.createZstdDecompress (Node >= 22.15).
      - run: npm install --no-save --no-package-lock jsdom@^30.1.2
      - run: python3 scripts/build.py
      - run: python3 scripts/validate.py
      - run: python3 scripts/build.py --check
      - run: node --check site/assets/site.js
      - run: node tests/srs.cjs
      - run: node tests/storage.cjs
      - run: node tests/quiz-dom.cjs
      - run: node tests/offline.cjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/configure-pages@v5
      - run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
